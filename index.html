<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Wedding</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #888888;
      --accent: #d6b8a9; /* 浪漫暖色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      background: linear-gradient(180deg, #fff 0%, #faf6f3 100%);
    }

    header h1 {
      font-size: clamp(36px, 6vw, 72px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      margin-top: 16px;
      font-size: 18px;
      color: var(--muted);
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      font-size: 14px;
      color: var(--muted);
      animation: fade 2s infinite;
    }

    @keyframes fade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    section.gallery {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 36px;
    }

    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .photo.show {
      opacity: 1;
      transform: translateY(0);
    } {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
    }

    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      cursor: pointer;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s ease;
    }

    .photo:hover img {
      transform: scale(1.08);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }

    .lightbox.active {
      display: flex;
    }

    footer {
      text-align: center;
      padding: 60px 20px 100px;
      color: var(--muted);
      font-size: 14px;
    }

    section.chapter {
      max-width: 720px;
      margin: 0 auto;
      padding: 120px 24px 80px;
      text-align: center;
    }

    section.chapter h2 {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    section.chapter p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>欢迎，下面将要展示的是</h1>
    <h2>周长城 <span>&</span> 周杨玲</h2>
    <p>婚纱相册</p>
    <div class="scroll-hint">请向下翻阅 ↓</div>
  </header>

  <section class="chapter">
    <h2>Ceremony</h2>
    <p>誓言，是这一天最安静也最坚定的部分。</p>
  </section>

  <section class="gallery" id="gallery"></section>

  <section class="chapter">
    <h2>Moments</h2>
    <p>光影、笑容、风，还有你。</p>
  </section>

  <div class="lightbox" id="lightbox">
    <img src="" alt="preview">
  </div>

  <footer>
    © 2026 · With Love
  </footer>

  <script>
    const gallery = document.getElementById('gallery');
    const totalPhotos = 55; // 照片总数

    // 生成占位 + 图片节点
    for (let i = 1; i <= totalPhotos; i++) {
      const div = document.createElement('div');
      div.className = 'photo';

      // 骨架屏占位
      div.style.background = 'linear-gradient(100deg, #f3f3f3 40%, #eaeaea 50%, #f3f3f3 60%)';
      div.style.backgroundSize = '200% 100%';
      div.style.animation = 'loading 1.4s ease infinite';

      const img = document.createElement('img');
      img.dataset.src = `images/${i}.jpg`;
      img.alt = 'wedding photo';
      img.loading = 'lazy';

      div.appendChild(img);
      gallery.appendChild(div);
    }

    // 懒加载 + 出现动画
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target.querySelector('img');
          if (img && !img.src) {
            img.src = img.dataset.src;
            img.onload = () => {
              entry.target.style.animation = 'none';
              entry.target.style.background = 'none';
            };
          }
          entry.target.classList.add('show');
          obs.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.01,
      rootMargin: '600px 0px'
    });

    document.querySelectorAll('.photo').forEach(photo => observer.observe(photo));

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');

    gallery.addEventListener('click', e => {
      if (e.target.tagName === 'IMG' && e.target.src) {
        lightboxImg.src = e.target.src;
        lightbox.classList.add('active');
      }
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    });
  </script>

</body>
</html>
